<!DOCTYPE html>
<html>
	<head>
		  <meta charset="UTF-8">
		    <meta name="viewport" content="width=device-width, initial-scale=1">
		      <title>Post - ze.sh</title>
	</head>
	<body>
		  <a href="/index.html">← Back</a>
		    <div id="post"></div>

		      <h2>Comments</h2>
		        <form id="comment-form">
				    <input type="text" name="content" placeholder="Write a comment" required>
				        <button type="submit">Comment</button>
					  </form>
					    <p id="message"></p>
					      <div id="comments"></div>
						<script src="/app.js"></script>
					        <script>
							    if (!token) window.location.href = "/login.html";

							    const postId = new URLSearchParams(window.location.search).get("id");
							    if (!postId) window.location.href = "/index.html";


							    async function loadPost() {
															    const me = await getMe();
															          const box = document.getElementById("post");
															          const res = await fetch("/posts/" + encodeURIComponent(postId));
															          if (!res.ok) {
																								          box.textContent = "Post not found.";
																								          return;
																								        }
															          const p = await res.json();

															          const name = document.createElement("strong");
															          name.textContent = "@" + p.user_name;

															          const content = document.createElement("p");
															          content.textContent = p.content;

															          const media = [];
															          for (const url of p.media_urls || []) {
																								          const isVideo = /\.(mp4|webm|mov)$/i.test(url);
																								          const el = document.createElement(isVideo ? "video" : "img");
																								          el.src = url;
																								          if (isVideo) el.controls = true;
																								          el.style.maxWidth = "300px";
																								          media.push(el);
																								        }

															          const likeBtn = document.createElement("button");
															          likeBtn.textContent = "♥ " + p.like_count;
															          likeBtn.addEventListener("click", async () => {
																								          const r = await api("/like_post", {
																																	            method: "POST",
																																	            headers: { "Content-Type": "application/json" },
																																	            body: JSON.stringify({ post_id: p.post_id })
																																	          });
																								          if (!r.ok) return;
																								          const data = await r.json();
																								          p.like_count += data.message === "Post liked" ? 1 : -1;
																								          likeBtn.textContent = "♥ " + p.like_count;
																								        });

			box.append(name, content, ...media, likeBtn);
if (me && me.user_id === p.user_id) {
  const del = document.createElement("button");
  del.textContent = "Delete post";
  del.addEventListener("click", async () => {
    if (!confirm("Delete this post?")) return;
    const r = await api("/posts/" + encodeURIComponent(p.post_id), { method: "DELETE" });
    if (r.ok) window.location.href = "/index.html";
  });
  box.append(" ", del);
}
															        }

							    async function loadComments() {
															          const list = document.getElementById("comments");
															          list.textContent = "";
															          const res = await fetch("/posts/" + encodeURIComponent(postId) + "/comments");
															          const comments = await res.json();
															          if (!Array.isArray(comments) || comments.length === 0) {
																								          list.textContent = "No comments yet.";
																								          return;
																								        }
															          for (const c of comments) {
																								          const div = document.createElement("div");
																								          const name = document.createElement("strong");
																								          name.textContent = "@" + c.user_name;
																								          const text = document.createElement("p");
																								          text.textContent = c.content;
																								          const when = document.createElement("small");
																								          when.textContent = new Date(c.created_at).toLocaleString();
																								          div.append(name, text, when, document.createElement("hr"));
																								          list.appendChild(div);
																								        }
															        }

							    document.getElementById("comment-form").addEventListener("submit", async (e) => {
															          e.preventDefault();
															          const message = document.getElementById("message");
															          message.textContent = "";
															          const res = await api("/posts/comments", {
																								          method: "POST",
																								          headers: { "Content-Type": "application/json" },
																								          body: JSON.stringify({ post_id: postId, content: e.target.content.value })
																								        });
															          if (res.ok) {
																								          e.target.reset();
																								          loadComments();
																								        } else {
																																	        message.textContent = "Couldn't comment.";
																																	      }
															        });

							    loadPost();
							    loadComments();
							  </script>
	</body>
</html>
