<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ze.sh</title>
</head>
<body>
  <h1>ze.sh</h1>
  <button id="logout">Log out</button>

  <h2>New post</h2>
  <form id="post-form">
    <textarea name="content" placeholder="What's happening?" required></textarea><br>
    <input type="file" id="files" accept="image/*,video/*" multiple>
    <button type="submit">Post</button>
  </form>
  <p id="message"></p>

  <h2>Feed</h2>
  <div id="feed"></div>

  <script src="/app.js"></script>
  <script>
    async function loadFeed() {
      const feed = document.getElementById("feed");
      feed.textContent = "";
      const res = await fetch("/posts/feed");
      const posts = await res.json();

      if (!Array.isArray(posts)) {
        feed.textContent = "No posts yet.";
        return;
      }
	const liked = await getLiked();
	for (const p of posts) feed.appendChild(renderPost(p, liked));
	      }
	const media = [];

	for (const url of p.media_urls || []) {
		const isVideo = /\.(mp4|webm|mov)$/i.test(url);
		const el = document.createElement(isVideo ? "video" : "img");
		el.src = url;
		if (isVideo) el.controls = true;
		el.style.maxWidth = "300px";
		media.push(el);
			  }

	const likeBtn = document.createElement("button");
			    likeBtn.textContent = "♥ " + p.like_count;
			    likeBtn.addEventListener("click", async () => {
					            const r = await api("/like_post", {
								              method: "POST",
								              headers: { "Content-Type": "application/json" },
								              body: JSON.stringify({ post_id: p.post_id })
								            });
					            if (!r.ok) return;
					            const data = await r.json();
					            p.like_count += data.message === "Post liked" ? 1 : -1;
					            likeBtn.textContent = "♥ " + p.like_count;
					          });

			    const when = document.createElement("small");
			    when.textContent = " " + new Date(p.created_at).toLocaleString();

	div.append(name, content, ...media, likeBtn, when, document.createElement("hr"));
        feed.appendChild(div);
      }
    }

    document.getElementById("post-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = document.getElementById("message");
      message.textContent = "";

      const form = new FormData();
      form.append("content", e.target.content.value);
      for (const f of document.getElementById("files").files) {
        form.append("files", f);
      }

      const res = await api("/posts", { method: "POST", body: form });
      if (res.ok) {
        e.target.reset();
        loadFeed();
      } else {
        message.textContent = "Couldn't post.";
      }
    });

    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("token");
      window.location.href = "/login.html";
    });

    loadFeed();
  </script>
</body> 
</html>
